<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="popupTitle">X-Metrics — Live Monitor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1 data-i18n="popupTitle">X-Metrics — Live Monitor</h1>
    <span id="version" class="muted"></span>
  </header>

  <section class="card">
    <label for="jwt" data-i18n="popupJwtLabel">Supabase JWT</label>
    <textarea id="jwt" rows="3" data-i18n-placeholder="popupJwtPlaceholder"></textarea>
    <div class="row">
      <button id="save" class="primary" data-i18n="popupBtnSave">Save token</button>
      <button id="ping" data-i18n="popupBtnPing">Test connection</button>
    </div>
    <p id="userline" class="muted small"></p>
  </section>

  <section class="card">
    <h2 data-i18n="popupSectionStatus">Status</h2>
    <p id="config-status" class="small"></p>
    <p id="scrape-status" class="small"></p>
    <p id="last-status" class="small"></p>
  </section>

  <footer>
    <p class="muted small">
      <span data-i18n="popupFooterHint">Open topstepx.com/trade to start sending snapshots.</span>
    </p>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
